<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Wedding Journey — Undangan Pernikahan</title>
  <meta name="description" content="Undangan pernikahan digital — Two Souls • One Crew • Forever">
  <meta name="theme-color" content="#0e2a4a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Wedding Journey — Undangan Pernikahan">
  <meta property="og:description" content="Two Souls • One Crew • Forever">
  <meta property="og:image" content="../../assets/img/og-image.jpg">
  <link rel="icon" type="image/png" href="../../favicon.png">
  <link rel="preload" as="image" href="assets/going-merry-sunset-600.webp" media="(max-width: 640px)">
  <link rel="preload" as="image" href="assets/going-merry-sunset.webp" media="(min-width: 641px)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="is-locked">

  <!-- =========================================================
       A. OPENING / COVER
       ========================================================= -->
  <section class="cover" id="cover" aria-label="Sampul undangan">
    <div class="cover-bg" aria-hidden="true"></div>
    <div class="cover-shade" aria-hidden="true"></div>
    <div class="cover-content">
      <p class="cover-kicker">The Wedding Journey</p>
      <h1 class="cover-names"><span data-bind="groom.nickname"></span><span class="amp">&amp;</span><span data-bind="bride.nickname"></span></h1>
      <p class="cover-tagline" data-bind="texts.tagline"></p>
      <p class="cover-opening" data-bind="texts.opening"></p>
      <div class="cover-guest" id="coverGuest" hidden>
        <small>Kepada Yth. Bapak/Ibu/Saudara/i</small>
        <strong id="guestName"></strong>
      </div>
      <button type="button" class="wood-btn wood-btn--lg" id="openBtn">
        <svg class="ic" aria-hidden="true"><use href="#i-scroll"/></svg><span>Buka Undangan</span>
      </button>
    </div>
  </section>

  <!-- Kontrol musik (selalu tersedia) -->
  <button type="button" class="music-btn" id="musicBtn" aria-pressed="false" aria-label="Putar musik">
    <svg class="ic ic-on" aria-hidden="true"><use href="#i-music"/></svg>
    <svg class="ic ic-off" aria-hidden="true"><use href="#i-music-off"/></svg>
    <span class="music-eq" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>

  <main id="main" class="journey" aria-hidden="true">

    <!-- =========================================================
         B. HERO / WEDDING INTRODUCTION
         ========================================================= -->
    <section class="hero" id="home" data-section="home">
      <div class="hero-sky" aria-hidden="true">
        <span class="sun"></span>
        <svg class="cloud c1" viewBox="0 0 200 60"><path d="M20 50a20 20 0 0 1 10-37 28 28 0 0 1 52-6 22 22 0 0 1 36 10 18 18 0 0 1 30 4 16 16 0 0 1 22 29z" fill="currentColor"/></svg>
        <svg class="cloud c2" viewBox="0 0 200 60"><path d="M20 50a20 20 0 0 1 10-37 28 28 0 0 1 52-6 22 22 0 0 1 36 10 18 18 0 0 1 30 4 16 16 0 0 1 22 29z" fill="currentColor"/></svg>
        <svg class="gull g1" viewBox="0 0 40 14"><path d="M1 12Q10 1 20 10Q30 1 39 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <svg class="gull g2" viewBox="0 0 40 14"><path d="M1 12Q10 1 20 10Q30 1 39 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <div class="hero-content">
        <div class="flag reveal" aria-hidden="true">
          <svg viewBox="0 0 120 90"><use href="#emblem"/></svg>
        </div>
        <p class="hero-kicker reveal">We Are Getting Married</p>
        <h2 class="hero-names reveal">
          <span data-bind="groom.nickname"></span>
          <span class="amp">&amp;</span>
          <span data-bind="bride.nickname"></span>
        </h2>
        <p class="hero-date reveal" id="heroDate"></p>
        <div class="countdown reveal" id="countdown" aria-live="off"></div>
        <p class="hero-invite reveal" data-bind="texts.invitation"></p>
      </div>
      <div class="hero-sea" aria-hidden="true">
        <svg class="ship" viewBox="0 0 120 100"><use href="#ship"/></svg>
        <svg class="wave w1" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 60 Q90 20 180 60 T360 60 T540 60 T720 60 T900 60 T1080 60 T1260 60 T1440 60 V120 H0Z"/></svg>
        <svg class="wave w2" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 70 Q120 35 240 70 T480 70 T720 70 T960 70 T1200 70 T1440 70 V120 H0Z"/></svg>
      </div>
    </section>

    <!-- C. AYAT / DOA -->
    <section class="section section--sea" id="ayat" data-section="ayat" aria-label="Ayat atau doa">
      <div class="wrap" id="verseMount"></div>
    </section>

    <!-- D. PROFIL MEMPELAI — WANTED POSTER -->
    <section class="section section--deck" id="mempelai" data-section="mempelai" aria-label="Profil mempelai">
      <div class="wrap">
        <div id="t-mempelai-wrap"></div>
        <div class="posters" id="postersMount"></div>
      </div>
    </section>

    <!-- E. DETAIL ACARA — LOG POSE -->
    <section class="section section--sky" id="acara" data-section="acara" aria-label="Detail acara">
      <div class="wrap">
        <div class="logpose reveal" aria-hidden="true">
          <svg viewBox="0 0 160 160"><use href="#logpose"/></svg>
        </div>
        <div id="eventsTitle"></div>
        <div class="events" id="eventsMount"></div>
      </div>
    </section>

    <!-- F. LOKASI — TREASURE MAP -->
    <section class="section section--sea" id="lokasi" data-section="lokasi" aria-label="Lokasi acara">
      <div class="wrap" id="mapMount"></div>
    </section>

    <!-- G. LOVE STORY — OUR ADVENTURE -->
    <section class="section section--sunset" id="cerita" data-section="cerita" aria-label="Kisah cinta">
      <div class="wrap">
        <p class="story-quote reveal">Dari satu pulau, menuju pulau lainnya…<br>bersama, sampai tujuan.</p>
        <div id="storyMount"></div>
      </div>
    </section>

    <!-- H. GALERI -->
    <section class="section section--sky" id="galeri" data-section="galeri" aria-label="Galeri foto">
      <div class="wrap" id="galleryMount"></div>
    </section>

    <!-- I. RSVP -->
    <section class="section section--deck" id="rsvp" data-section="rsvp" aria-label="Konfirmasi kehadiran">
      <div class="wrap wrap--narrow" id="rsvpMount"></div>
    </section>

    <!-- J. UCAPAN — MESSAGE IN A BOTTLE -->
    <section class="section section--sea" id="ucapan" data-section="ucapan" aria-label="Ucapan dan doa">
      <div class="wrap wrap--narrow" id="guestbookMount"></div>
    </section>

    <!-- K. WEDDING GIFT — TREASURE CHEST -->
    <section class="section section--deck" id="hadiah" data-section="hadiah" aria-label="Wedding gift">
      <div class="wrap wrap--narrow" id="giftMount"></div>
    </section>

    <!-- L. CLOSING -->
    <section class="closing" id="penutup" data-section="penutup" aria-label="Penutup">
      <div class="closing-bg" aria-hidden="true"></div>
      <div class="closing-shade" aria-hidden="true"></div>
      <div class="wrap wrap--narrow closing-content">
        <div class="parchment closing-card reveal">
          <h2 class="closing-title">Terima Kasih</h2>
          <p data-bind="texts.closing"></p>
          <div class="closing-emblem" aria-hidden="true"><svg viewBox="0 0 120 90"><use href="#emblem"/></svg></div>
          <p class="closing-names"><span data-bind="groom.nickname"></span> &amp; <span data-bind="bride.nickname"></span></p>
          <p class="closing-sign" data-bind="texts.closingSignature"></p>
        </div>
        <a href="#home" class="wood-btn" id="backTopBtn"><svg class="ic" aria-hidden="true"><use href="#i-arrow-up"/></svg><span>Kembali ke Atas</span></a>
        <p class="credit" id="credit"></p>
      </div>
    </section>
  </main>

  <!-- Navigasi bawah -->
  <nav class="dock" id="dock" aria-label="Navigasi undangan" hidden>
    <a href="#home" data-nav="home"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>Beranda</span></a>
    <a href="#mempelai" data-nav="mempelai"><svg class="ic" aria-hidden="true"><use href="#i-users"/></svg><span>Mempelai</span></a>
    <a href="#acara" data-nav="acara"><svg class="ic" aria-hidden="true"><use href="#i-calendar"/></svg><span>Acara</span></a>
    <a href="#galeri" data-nav="galeri"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg><span>Galeri</span></a>
    <a href="#ucapan" data-nav="ucapan"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg><span>Ucapan</span></a>
  </nav>

  <!-- Tombol ke atas -->
  <a href="#home" class="to-top" id="toTop" aria-label="Kembali ke atas" hidden><svg class="ic" aria-hidden="true"><use href="#i-arrow-up"/></svg></a>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Pratinjau foto" hidden>
    <button type="button" class="lb-close" id="lbClose" aria-label="Tutup"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="Foto sebelumnya"><svg class="ic" aria-hidden="true"><use href="#i-chev-left"/></svg></button>
    <figure class="lb-figure"><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
    <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="Foto berikutnya"><svg class="ic" aria-hidden="true"><use href="#i-chev-right"/></svg></button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- =========================================================
       SPRITE: ikon & ilustrasi orisinal (SVG)
       ========================================================= -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></g></symbol>
      <symbol id="i-music-off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path d="M3 3l18 18"/></g></symbol>
      <symbol id="i-scroll" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 4h11a3 3 0 0 1 0 6H6"/><path d="M6 4a3 3 0 0 0 0 6v8a2 2 0 0 0 2 2h10V10"/><path d="M10 14h5M10 17h3"/></g></symbol>
      <symbol id="i-anchor" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.2"/><path d="M12 7.2V21M8 11h8M4.5 14a7.5 7.5 0 0 0 15 0"/></g></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></g></symbol>
      <symbol id="i-compass" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></g></symbol>
      <symbol id="i-ship" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 16h18l-2.5 4h-13z"/><path d="M12 3v13M12 4l6 9h-6M12 6l-5 7h5"/></g></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 20s-7-4.3-8.8-8.7C2 8 4 4.8 7.2 4.8c2 0 3.3 1 4.8 2.8 1.5-1.8 2.8-2.8 4.8-2.8C20 4.8 22 8 20.8 11.3 19 15.7 12 20 12 20z"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></g></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></g></symbol>
      <symbol id="i-bottle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M10 2h4v3l2 3v12a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V8l2-3z"/><path d="M10 12h4M10 15h3"/></g></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-4 3.5-5.5 6.5-5.5s5.7 1.5 6.5 5.5"/><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.3 3.6 5.2"/></g></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></g></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 5h16v11H9l-5 4z"/></symbol>
      <symbol id="i-gift" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8S10.5 3 8 4s0 4 4 4zM12 8s1.5-5 4-4 0 4-4 4z"/></g></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-chev-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-chev-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-instagram" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></g></symbol>
      <symbol id="i-truck" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 6h12v10H2zM14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></g></symbol>

      <!-- Emblem kru orisinal: hati + jangkar bersilang -->
      <symbol id="emblem" viewBox="0 0 120 90">
        <rect x="4" y="6" width="112" height="78" rx="4" fill="#15161c"/>
        <path d="M4 84q14-6 28 0t28 0 28 0 28 0V84" fill="#15161c"/>
        <g stroke="#f4ead6" stroke-width="4" stroke-linecap="round" fill="none">
          <path d="M30 70L90 22M90 70L30 22"/>
        </g>
        <g fill="#f4ead6"><circle cx="30" cy="22" r="5"/><circle cx="90" cy="22" r="5"/><circle cx="30" cy="70" r="5"/><circle cx="90" cy="70" r="5"/></g>
        <path d="M60 66s-17-10-17-22c0-6 4-10 9-10 4 0 6 2 8 5 2-3 4-5 8-5 5 0 9 4 9 10 0 12-17 22-17 22z" fill="#e8574d" stroke="#f4ead6" stroke-width="3"/>
      </symbol>

      <!-- Kapal siluet orisinal -->
      <symbol id="ship" viewBox="0 0 120 100">
        <path d="M58 6v62" stroke="#3b2414" stroke-width="3"/>
        <path d="M58 10q30 10 34 44H58z" fill="#fff6e4" stroke="#c9b48c" stroke-width="1.5"/>
        <path d="M56 18q-22 10-26 36h26z" fill="#fbecd0" stroke="#c9b48c" stroke-width="1.5"/>
        <path d="M58 4l16 5-16 5z" fill="#e8574d"/>
        <path d="M66 26q6 4 0 10-6-6 0-10z" fill="#e8574d" opacity=".8"/>
        <path d="M10 64h100l-12 22H24z" fill="#7a4a26"/>
        <path d="M10 64h100l-3 6H13z" fill="#a8693a"/>
        <g fill="#3b2414"><circle cx="38" cy="75" r="2.2"/><circle cx="58" cy="75" r="2.2"/><circle cx="78" cy="75" r="2.2"/></g>
      </symbol>

      <!-- Log Pose / kompas orisinal -->
      <symbol id="logpose" viewBox="0 0 160 160">
        <circle cx="80" cy="84" r="62" fill="#6b4524"/>
        <circle cx="80" cy="84" r="56" fill="#c69a4e"/>
        <circle cx="80" cy="84" r="48" fill="#1f7f86"/>
        <circle cx="80" cy="84" r="48" fill="url(#lpGlass)"/>
        <g stroke="#e6f5f2" stroke-width="2" opacity=".7">
          <path d="M80 40v8M80 120v8M36 84h8M116 84h8M49 53l5 5M106 110l5 5M111 53l-5 5M54 110l-5 5"/>
        </g>
        <path class="lp-needle" d="M80 46l7 38-7 38-7-38z" fill="#f4ead6"/>
        <path class="lp-needle" d="M80 46l7 38H73z" fill="#e8574d"/>
        <circle cx="80" cy="84" r="5" fill="#6b4524"/>
        <rect x="70" y="12" width="20" height="14" rx="3" fill="#6b4524"/>
        <circle cx="80" cy="12" r="7" fill="none" stroke="#6b4524" stroke-width="4"/>
        <defs><radialGradient id="lpGlass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
      </symbol>

      <!-- Peti harta orisinal -->
      <symbol id="chest" viewBox="0 0 200 150">
        <ellipse cx="100" cy="140" rx="86" ry="8" fill="#000" opacity=".25"/>
        <path d="M24 64h152v68a6 6 0 0 1-6 6H30a6 6 0 0 1-6-6z" fill="#7a4a26"/>
        <path d="M24 64h152v10H24z" fill="#5a3418"/>
        <g fill="#f2c14e"><circle cx="70" cy="58" r="10"/><circle cx="92" cy="52" r="11"/><circle cx="116" cy="56" r="10"/><circle cx="134" cy="60" r="8"/><circle cx="54" cy="62" r="7"/></g>
        <g fill="#ffe08a" opacity=".8"><circle cx="88" cy="48" r="3"/><circle cx="114" cy="52" r="2.5"/></g>
        <path d="M30 64C30 30 60 18 100 18s70 12 70 46z" fill="#8f5a2e" transform="rotate(-8 30 64) translate(-4 -14)"/>
        <g fill="#c9a24a"><rect x="40" y="64" width="10" height="74"/><rect x="150" y="64" width="10" height="74"/><rect x="24" y="96" width="152" height="8"/></g>
        <rect x="88" y="86" width="24" height="28" rx="4" fill="#e1b955" stroke="#6b4524" stroke-width="2"/>
        <circle cx="100" cy="98" r="4" fill="#3b2414"/><path d="M98 100h4v8h-4z" fill="#3b2414"/>
      </symbol>
    </defs>
  </svg>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
